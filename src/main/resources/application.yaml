server:
  port: 5054

spring:
  application:
    name: mulemind-job-service

  datasource:
    url: jdbc:mysql://localhost:3306/mulemind_db
    username: root
    password: ellenverma
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      linger-ms: 10

    topics:
      mulemind-events: mules-project-uploaded     


minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: documents
